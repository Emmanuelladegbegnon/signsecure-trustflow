<body class="bg-surface text-on-surface flex flex-col min-h-screen antialiased selection:bg-error-container selection:text-on-error-container">
<!-- Top App Bar (Task-focused context, hiding global nav clusters per rules, keeping a simple header with back button) -->
<header class="flex justify-between items-center w-full h-16 px-margin-mobile bg-surface shadow-sm z-40 sticky top-0 border-b-0">
<button aria-label="Retour" class="text-on-surface-variant p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-on-surface flex-1 text-center truncate px-4">Déclarer un incident</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-container-max mx-auto p-margin-mobile flex flex-col gap-[36px] overflow-y-auto pb-24">
<!-- Context / Warning Card -->
<section class="bg-error-container rounded-xl p-4 shadow-sm flex gap-3 items-start border border-error/20">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="warning">warning</span>
<div>
<h2 class="font-label-md text-label-md text-on-error-container mb-1">Attention requise</h2>
<p class="font-body-sm text-body-sm text-on-error-container/80">
                    Veuillez fournir des détails précis concernant l'incident. Ces informations sont cruciales pour nos équipes de conformité et de sécurité.
                </p>
</div>
</section>
<!-- Incident Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Type d'incident Dropdown -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="incident_type">Type d'incident</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary shadow-sm transition-all" id="incident_type" name="incident_type">
<option disabled="" selected="" value="">Sélectionnez un type</option>
<option value="falsification">Falsification de document</option>
<option value="usurpation">Usurpation d'identité</option>
<option value="perte">Perte de données</option>
<option value="technique">Problème technique (Signature)</option>
<option value="autre">Autre</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Description Textarea -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="incident_description">Description détaillée</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary shadow-sm transition-all placeholder:text-on-surface-variant/50 resize-y" id="incident_description" name="incident_description" placeholder="Décrivez les circonstances, l'heure, et les parties impliquées..." rows="5"></textarea>
</div>
<!-- Photo Attachment -->
<div class="flex flex-col gap-1.5">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Pièce(s) jointe(s) (Optionnel)</span>
<button class="w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-outline-variant rounded-lg text-primary bg-surface-container-lowest hover:bg-surface-container-low transition-colors group" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-md text-label-md">Ajouter une photo ou un document</span>
</button>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Formats acceptés: JPG, PNG, PDF. Max 5MB.</p>
</div>
<!-- Submit Button (Sticky at bottom for mobile) -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] border-t border-outline-variant z-50">
<button class="w-full bg-error text-on-error font-label-md text-label-md py-3.5 px-6 rounded-lg shadow-sm hover:bg-error/90 active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" data-icon="report" data-weight="fill" style="font-variation-settings: 'FILL' 1;">report</span>
                    Déclarer l'incident
                </button>
</div>
</form>
</main>
