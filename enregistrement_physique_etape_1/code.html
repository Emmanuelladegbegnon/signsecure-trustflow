</header>

<!-- Multi-step indicator -->

<div class="flex items-center justify-between relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-surface-variant -z-10 rounded-full"></div>

<span class="font-label-sm text-label-sm text-primary">Informations</span>
</div>
<!-- Step 2 (Inactive) -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-md text-label-md">2</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Métadonnées</span>
</div>
<!-- Step 3 (Inactive) -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-md text-label-md">3</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Validation</span>
</div>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-6">
            Veuillez renseigner les informations relatives au document physique pour l'intégrer à la chaîne de confiance.
        </p>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Contextual Checkbox Box -->
<div class="bg-surface-container-lowest p-4 rounded-xl border border-outline-variant shadow-sm hover:border-primary transition-colors cursor-pointer group">
<label class="flex items-start gap-3 cursor-pointer">
<div class="flex items-center h-6">
<input class="w-5 h-5 rounded text-primary focus:ring-primary border-outline-variant bg-surface-container-lowest cursor-pointer" type="checkbox"/>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Je confirme que ce document a été signé hors SignSecure</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1">Cochez cette case si le document original est au format papier ou a été signé électroniquement via un tiers.</span>
</div>
</label>
</div>
<!-- Fields Container -->
<div class="bg-surface-container-lowest rounded-xl p-5 border border-outline-variant shadow-sm flex flex-col gap-5">
<!-- Type de document -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="doc-type">Type de document *</label>
<div class="relative">
<select class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow" id="doc-type">
<option disabled="" selected="" value="">Sélectionner un type</option>
<option value="contrat">Contrat Commercial</option>
<option value="avenant">Avenant</option>
<option value="attestation">Attestation Fiscale</option>
<option value="pv">Procès-verbal</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Titre -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="doc-title">Titre du document *</label>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow placeholder-on-surface-variant/50" id="doc-title" placeholder="Ex: Contrat de prestation de services SA" type="text"/>
</div>
<!-- Référence -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="doc-ref">Référence interne</label>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow placeholder-on-surface-variant/50" id="doc-ref" placeholder="Ex: REF-2023-10-A" type="text"/>
</div>
<!-- Date et Lieu Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- Date -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="doc-date">Date de signature *</label>
<div class="relative">
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow" id="doc-date" type="date"/>
</div>
</div>
<!-- Lieu -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="doc-location">Lieu de réception</label>
<div class="relative">
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant rounded-lg px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface transition-shadow placeholder-on-surface-variant/50" id="doc-location" placeholder="Ex: Siège Abidjan" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="location_on">location_on</span>
</div>
</div>
</div>
</div>
</form>
</main>
