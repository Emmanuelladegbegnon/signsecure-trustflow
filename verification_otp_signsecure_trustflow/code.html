<input aria-label="Digit 3" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" maxlength="1" type="number"/>

                </button>

<!-- Resend / Countdown -->
<div class="mt-6 text-center">

<span class="material-symbols-outlined text-[16px]" data-icon="refresh">refresh</span>

</p>
<button class="hidden mt-2 font-label-sm text-label-sm text-primary hover:underline underline-offset-2" id="resend-btn">
                    Renvoyer le code maintenant
                </button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-inputs input');
            const submitBtn = document.getElementById('submit-btn');
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            // Auto-advance OTP inputs
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Restrict to single digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Move to next input if filled
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }

                    checkCompletion();
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous on backspace if empty
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });

            // Check if all inputs are filled to enable button
            function checkCompletion() {
                const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                if (isComplete) {
                    submitBtn.removeAttribute('disabled');
                    submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    submitBtn.setAttribute('disabled', 'true');
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            // Simple Countdown Timer
            let timeLeft = 45;
            const countdown = setInterval(() => {
                timeLeft--;
                let seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerDisplay.textContent = `00:${seconds}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.parentElement.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                }
            }, 1000);
        });
    </script>
